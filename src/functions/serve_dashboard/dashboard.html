<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BADI Oerlikon – Occupancy Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-dim: rgba(56, 189, 248, 0.15);
            --green: #4ade80;
            --amber: #fbbf24;
            --red: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1.5rem;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 600;
        }
        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .controls button {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.15s;
        }
        .controls button:hover { border-color: var(--accent); color: var(--text); }
        .controls button.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }
        .card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .card .value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }
        .card .unit {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .chart-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .chart-container canvas {
            width: 100% !important;
        }

        .status-bar {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .status-bar .dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }
        .dot.ok { background: var(--green); }
        .dot.loading { background: var(--amber); }
        .dot.error { background: var(--red); }

        .error-msg {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🏊 BADI Oerlikon Occupancy</h1>
    <p class="subtitle">Live data from CrowdMonitor</p>
</div>

<div class="controls">
    <button data-days="1" data-res="5min">Today</button>
    <button data-days="3" data-res="5min">3 Days</button>
    <button data-days="7" data-res="1hour" class="active">Week</button>
    <button data-days="14" data-res="1hour">2 Weeks</button>
    <button data-days="30" data-res="1day">Month</button>
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="cards">
    <div class="card">
        <div class="label">Latest</div>
        <div class="value" id="cardLatest">–</div>
        <div class="unit">people</div>
    </div>
    <div class="card">
        <div class="label">Today Peak</div>
        <div class="value" id="cardPeak">–</div>
        <div class="unit">people</div>
    </div>
    <div class="card">
        <div class="label">Today Avg</div>
        <div class="value" id="cardAvg">–</div>
        <div class="unit">people</div>
    </div>
    <div class="card">
        <div class="label">Data Points</div>
        <div class="value" id="cardCount">–</div>
        <div class="unit">readings</div>
    </div>
</div>

<div class="chart-container">
    <canvas id="occupancyChart" height="300"></canvas>
</div>

<div class="status-bar">
    <span class="dot loading" id="statusDot"></span>
    <span id="statusText">Loading…</span>
</div>

<script>
    // ── Config ──────────────────────────────────────────────────
    // Resolve the API base URL relative to this page.
    // When served from /api/dashboard the sibling endpoint is /api/occupancy.
    const API_BASE = window.location.pathname.replace(/\/dashboard\/?$/, '');
    const API_URL = `${API_BASE}/occupancy`;

    let chart = null;

    // ── Chart setup ─────────────────────────────────────────────
    function initChart() {
        const ctx = document.getElementById('occupancyChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Occupancy',
                    data: [],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.08)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0,
                    pointHitRadius: 8,
                    borderWidth: 2,
                }, {
                    label: 'Min',
                    data: [],
                    borderColor: 'rgba(74, 222, 128, 0.4)',
                    borderWidth: 1,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    fill: false,
                }, {
                    label: 'Max',
                    data: [],
                    borderColor: 'rgba(248, 113, 113, 0.4)',
                    borderWidth: 1,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    fill: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: true, labels: { color: '#94a3b8', boxWidth: 12 } },
                    tooltip: {
                        backgroundColor: '#1e293b',
                        titleColor: '#e2e8f0',
                        bodyColor: '#e2e8f0',
                        borderColor: '#334155',
                        borderWidth: 1,
                        callbacks: {
                            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y} people`
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: { tooltipFormat: 'PPpp' },
                        grid: { color: 'rgba(51, 65, 85, 0.5)' },
                        ticks: { color: '#94a3b8', maxTicksLimit: 12 },
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(51, 65, 85, 0.5)' },
                        ticks: { color: '#94a3b8' },
                        title: { display: true, text: 'People', color: '#94a3b8' },
                    }
                }
            }
        });
    }

    // ── Data fetching ───────────────────────────────────────────
    async function fetchData(days, resolution) {
        setStatus('loading', 'Loading…');
        hideError();

        try {
            const resp = await fetch(`${API_URL}?days=${days}&resolution=${resolution}`);
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.error || `HTTP ${resp.status}`);
            }
            const json = await resp.json();
            updateChart(json.data);
            updateCards(json.data, json.meta);
            setStatus('ok', `${json.meta.count} points from ${json.meta.raw_readings} readings · updated ${new Date().toLocaleTimeString()}`);
        } catch (e) {
            showError(e.message);
            setStatus('error', 'Failed to load data');
        }
    }

    // ── UI updates ──────────────────────────────────────────────
    function updateChart(data) {
        const avg = data.map(d => ({ x: new Date(d.timestamp), y: d.occupancy }));
        const mins = data.filter(d => d.min != null).map(d => ({ x: new Date(d.timestamp), y: d.min }));
        const maxs = data.filter(d => d.max != null).map(d => ({ x: new Date(d.timestamp), y: d.max }));

        chart.data.datasets[0].data = avg;
        chart.data.datasets[1].data = mins;
        chart.data.datasets[2].data = maxs;
        chart.update('none');
    }

    function updateCards(data, meta) {
        if (!data.length) {
            ['cardLatest', 'cardPeak', 'cardAvg', 'cardCount'].forEach(
                id => document.getElementById(id).textContent = '–'
            );
            return;
        }

        // Latest reading
        const latest = data[data.length - 1];
        document.getElementById('cardLatest').textContent = Math.round(latest.occupancy);

        // Today's data only for peak/avg
        const todayStr = new Date().toISOString().slice(0, 10);
        const todayData = data.filter(d => d.timestamp.startsWith(todayStr));

        if (todayData.length) {
            const peak = Math.max(...todayData.map(d => d.max != null ? d.max : d.occupancy));
            const avg = todayData.reduce((s, d) => s + d.occupancy, 0) / todayData.length;
            document.getElementById('cardPeak').textContent = peak;
            document.getElementById('cardAvg').textContent = Math.round(avg);
        } else {
            document.getElementById('cardPeak').textContent = '–';
            document.getElementById('cardAvg').textContent = '–';
        }

        document.getElementById('cardCount').textContent =
            meta.raw_readings > 999 ? `${(meta.raw_readings / 1000).toFixed(1)}k` : meta.raw_readings;
    }

    function setStatus(state, text) {
        const dot = document.getElementById('statusDot');
        dot.className = `dot ${state}`;
        document.getElementById('statusText').textContent = text;
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorMsg').style.display = 'none';
    }

    // ── Button wiring ───────────────────────────────────────────
    document.querySelectorAll('.controls button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchData(btn.dataset.days, btn.dataset.res);
        });
    });

    // ── Init ────────────────────────────────────────────────────
    initChart();
    // Load default view (week, 1hour resolution)
    fetchData(7, '1hour');

    // Auto-refresh every 5 minutes
    setInterval(() => {
        const active = document.querySelector('.controls button.active');
        if (active) fetchData(active.dataset.days, active.dataset.res);
    }, 5 * 60 * 1000);
</script>

</body>
</html>
