# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - badi-oerlikon-dev-func

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/functions'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Verify critical packages
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          python -c "import sys; sys.path.insert(0, '.python_packages/lib/site-packages'); import websockets; print(f'websockets {websockets.__version__} OK')"
          python -c "import sys; sys.path.insert(0, '.python_packages/lib/site-packages'); import azure.storage.blob; print('azure-storage-blob OK')"

      # Optional: Add step to run tests here

      - name: Zip artifact for deployment
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          zip -r ${{ github.workspace }}/release.zip . -x '.venv/*' '__pycache__/*' '*.pyc' 'deploy/*' 'build/*' '.funcignore'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          mkdir -p deploy
          cd deploy
          unzip ../release.zip
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_140896A81301410FBCD87618503D9E09 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0DEA1B9CA7344396AB84F0EA87E6F4E5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34DB6AE736D945BE86084A84EA297B59 }}

      - name: Set app settings for remote build
        uses: azure/appservice-settings@v1
        with:
          app-name: 'badi-oerlikon-dev-func'
          app-settings-json: |
            [
              { "name": "ENABLE_ORYX_BUILD", "value": "true" },
              { "name": "SCM_DO_BUILD_DURING_DEPLOYMENT", "value": "true" }
            ]

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'badi-oerlikon-dev-func'
          slot-name: 'Production'
          package: deploy
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          