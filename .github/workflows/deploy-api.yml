# CI/CD for the API function app (dashboard, occupancy, health).
# Deploys only when API code changes — collector stays untouched.

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/api'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Verify critical packages
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          python -c "import sys; sys.path.insert(0, '.python_packages/lib/site-packages'); import plotly; print(f'plotly {plotly.__version__} OK')"
          python -c "import sys; sys.path.insert(0, '.python_packages/lib/site-packages'); import azure.storage.blob; print('azure-storage-blob OK')"

      - name: Zip artifact for deployment
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          zip -r ${{ github.workspace }}/api.zip . -x '.venv/*' '__pycache__/*' '*.pyc' '.funcignore'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: api.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: Unzip artifact for deployment
        run: |
          mkdir -p deploy
          cd deploy
          unzip ../api.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_140896A81301410FBCD87618503D9E09 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0DEA1B9CA7344396AB84F0EA87E6F4E5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34DB6AE736D945BE86084A84EA297B59 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'badi-oerlikon-dev-api'
          slot-name: 'Production'
          package: deploy
